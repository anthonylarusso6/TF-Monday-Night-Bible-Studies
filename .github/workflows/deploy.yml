name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deployment
        run: |
          curl -s -X POST \
            "https://api.vercel.com/v1/integrations/deploy/prj_54ePVPTljzMe5obA26dMNisWNSul/0gEkYkNs3n" \
            | grep -o '"job":{"id":"[^"]*"' || echo "Deploy triggered"
