<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <path id="topArc" d="M 18,100 A 82,82 0 0,1 182,100"/>
    <path id="botArc" d="M 30,138 A 82,82 0 0,0 170,138"/>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="#0a3a52"/>

  <!-- Outer gold ring -->
  <circle cx="100" cy="100" r="93" fill="none" stroke="#d4a843" stroke-width="2.5"/>

  <!-- Inner thin ring -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#d4a843" stroke-width="0.75" opacity="0.45"/>

  <!-- Diamond accents at 3 and 9 o'clock -->
  <polygon points="5,100 12,93 19,100 12,107" fill="#d4a843"/>
  <polygon points="195,100 188,93 181,100 188,107" fill="#d4a843"/>

  <!-- TRIPLE F curved along top -->
  <text fill="#d4a843" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="13.5" letter-spacing="5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">TRIPLE  F</textPath>
  </text>

  <!-- Gold cross above TF -->
  <line x1="100" y1="39" x2="100" y2="56" stroke="#d4a843" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="91"  y1="47" x2="109" y2="47" stroke="#d4a843" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Small circle around cross -->
  <circle cx="100" cy="47" r="12" fill="none" stroke="#d4a843" stroke-width="0.75" opacity="0.5"/>

  <!-- TF letters -->
  <text x="100" y="125" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900" font-size="68" fill="white" letter-spacing="-3">TF</text>

  <!-- Thin gold line above bottom text -->
  <line x1="36" y1="140" x2="164" y2="140" stroke="#d4a843" stroke-width="0.75" opacity="0.5"/>

  <!-- BIBLE STUDY'S bottom text -->
  <text x="100" y="156" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="700" font-size="10.5" fill="#d4a843" letter-spacing="3">BIBLE STUDY&apos;S</text>

  <!-- Bottom dot accents -->
  <circle cx="28"  cy="148" r="2.5" fill="#d4a843" opacity="0.7"/>
  <circle cx="172" cy="148" r="2.5" fill="#d4a843" opacity="0.7"/>

  <!-- Knoxville TN small text -->
  <text x="100" y="170" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="600" font-size="8" fill="rgba(255,255,255,0.35)" letter-spacing="2">KNOXVILLE · TN</text>
</svg>
